name: Release

on:
  push:
    tags:
      - "v*"

# Read-only unless a job says otherwise. Publishing the release needs
# contents: write; that grant is on the release job below.
permissions:
  contents: read

jobs:
  release:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test
        run: |
          xcodebuild test \
            -project MacOSCertRev.xcodeproj \
            -scheme MacOSCertRev \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData

      - name: Build
        run: |
          xcodebuild build \
            -project MacOSCertRev.xcodeproj \
            -scheme MacOSCertRev \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="build/DerivedData/Build/Products/Release/CertRev.app"
          short="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          if [ "$short" != "$version" ]; then
            echo "CFBundleShortVersionString is $short, tag is $version" >&2
            exit 1
          fi
          # Ad-hoc signature until a Developer ID certificate is added.
          codesign --verify --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "CertRev-${version}.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "CertRev-${version}.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "CertRev-${{ steps.package.outputs.version }}.zip" \
            --title "CertRev ${{ steps.package.outputs.version }}" \
            --notes "CertRev ${{ steps.package.outputs.version }} for macOS 15 or later."

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set. The GitHub Release is already published." >&2
            exit 1
          fi
          # git -c applies the header to this command only. It is not written to
          # the origin URL or .git/config. macOS base64 wraps at 76 columns.
          basic="$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n\r')"
          printf '%s\n' "::add-mask::${basic}"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic}"
          git -c "$header" clone --depth 1 https://github.com/cloudguyus/homebrew-tap.git tap
          python3 scripts/update-homebrew-cask.py tap/Casks/certrev.rb
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap config user.name "github-actions[bot]"
          git -C tap add Casks/certrev.rb
          git -C tap commit -m "certrev ${VERSION}"
          git -C tap -c "$header" push origin HEAD:main
          unset basic header
