name: Feature request
description: Suggest a change or new capability for CertRev.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What you are trying to do with a certificate, and what gets in the way today.
      placeholder: I need to inspect a certificate that CertRev cannot open.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What CertRev should do, and how you would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including any workaround you use now.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of CertRev this request is about.
      options:
        - file formats / import
        - certificate details view
        - chain / trust validation
        - export
        - UI / UX
        - Homebrew / install
        - other
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      description: Optional. Leave this unchecked if you only want to request the change.
      options:
        - label: I am willing to contribute a pull request for this
          required: false
